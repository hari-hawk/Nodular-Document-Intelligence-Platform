doc_types:
  policy:
    aliases: [policy_declaration, declarations_page, renewal_notice, endorsement]
    description: Policy declaration page, renewal, or endorsement
  claim:
    aliases: [claim_form, claim_submission, first_notice_of_loss, fnol]
