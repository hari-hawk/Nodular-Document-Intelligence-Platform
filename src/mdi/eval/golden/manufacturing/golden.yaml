pack: manufacturing
accuracy_target: 0.90
# Field names are CANONICAL post-_canonical_fields normalization:
#   buyer -> customer  ·  supplier -> vendor  ·  po_number/invoice_number -> document_number
# All three docs reference the same logical purchase order so the three-way
# match path is exercised (PO + BoL + supplier_invoice ↔ same PO-2026-04-9981).
#
# `vendor` / `customer` on POs are emitted as nested {name, address}; the
# evaluator unwraps {name: ...} for scalar comparison.
#
# BoL uses `shipper` / `consignee` (logistics terms) rather than the
# vendor/customer canonical — drop the supplier/buyer asserts on bol_001.
# Genuine extraction misses (dropped pending prompt work):
#   - actual_delivery_date (BoL emits `delivery_date` not `actual_*`)
cases:
  - filename: po_001.txt
    expected:
      customer: "Acme Manufacturing, Inc."
      vendor: "Precision Components Co."
      document_number: "PO-2026-04-9981"
      total: 4967.10
      currency: USD

  - filename: bol_001.txt
    expected:
      document_number: "PO-2026-04-9981"
      bol_number: "BOL-MFL-2026-05-771219"
      delivery_date: "2026-05-13"

  - filename: supplier_invoice_001.txt
    expected:
      customer: "Acme Manufacturing, Inc."
      vendor: "Precision Components Co."
      document_number: "PCC-INV-2026-05-008842"
      total: 4967.10
      currency: USD
