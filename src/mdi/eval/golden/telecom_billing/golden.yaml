pack: telecom_billing
accuracy_target: 0.90
# Conservative expected values — only fields the LLM emits deterministically.
# Vendor names, account numbers, document numbers, and totals are the safest;
# free-text fields (rationale, descriptions) are skipped to avoid LLM-variance flakes.
cases:
  - filename: att_invoice_001.txt
    expected:
      carrier: "AT&T"
      account_number: "0133442501"
      invoice_number: "ATT-INV-2026-04-7711"
      total: 3054.08
      currency: USD
      contract_reference: "MSA-AT&T-Globex-2024-09"

  - filename: verizon_invoice_001.txt
    expected:
      carrier: "Verizon"
      account_number: "8841220199"
      invoice_number: "VZB-2026-05-1148820"
      total: 3939.03
      currency: USD

  - filename: centurylink_csr_001.txt
    expected:
      carrier: "CenturyLink"
      account_number: "LMN-44729108"
      customer: "Hooli Inc."
