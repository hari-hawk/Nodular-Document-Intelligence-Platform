[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdi"
version = "0.1.0"
description = "Modular Data Intelligence — multi-domain document intelligence brain on a kernel-pack-tenant chassis with a persistent knowledge graph layer."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MDI Platform Team" },
]
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

dependencies = [
    # API + async
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "anyio>=4.4",
    "httpx>=0.27",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",

    # LLM
    "google-generativeai>=0.7",
    "tenacity>=8.5",

    # Embeddings (loaded lazily — heavy)
    "sentence-transformers>=3.0",

    # Document parsing
    "pypdf>=4.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "Pillow>=10.4",

    # Pack format
    "PyYAML>=6.0",

    # Safety
    "simpleeval>=1.0",

    # Auth
    "PyJWT>=2.9",
    "passlib[bcrypt]>=1.7",
    "cryptography>=43",

    # Job queue
    "celery>=5.4",
    "redis>=5.0",

    # Entity resolution
    "rapidfuzz>=3.9",

    # Observability (optional — no-op when key absent)
    "langfuse>=2.43",

    # UI
    "streamlit>=1.38",

    # Misc
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
    "types-PyYAML",
    "reportlab>=4.2",  # for generating sample PDFs in test fixtures
]

[project.scripts]
mdi-api = "mdi.api.main:run"
mdi-ui = "mdi.ui.streamlit_app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mdi.packs" = ["**/*.yaml", "**/*.yml", "**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires Postgres + Redis (docker-compose up)",
    "live_llm: hits real Gemini API; opt-in only",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "rapidfuzz.*", "simpleeval.*", "celery.*", "langfuse.*"]
ignore_missing_imports = true
