name: CI

# Runs on every push and PR. Stays fully offline — no LLM keys, no external
# network. Provider calls are intercepted by FakeGateway via tests/conftest.py
# (GOOGLE_API_KEY is forced empty). Live-LLM tests live in tests/live_llm/
# and self-skip without the --run-live flag; see live-llm.yml for the manual
# workflow that exercises them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + offline pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres + pgvector as a service container. pg15 matches docker-compose.yml.
    # The default `mdi` superuser is created by the image; we add the non-superuser
    # `mdi_app` role in a bootstrap step below — the app uses it so RLS is enforced
    # (superusers bypass RLS unconditionally, which would mask multi-tenant leaks).
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: mdi
          POSTGRES_PASSWORD: mdi
          POSTGRES_DB: mdi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdi -d mdi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Offline test env. DATABASE_URL_ADMIN_SYNC is the superuser DSN used by
      # the fresh_db fixture to TRUNCATE; DATABASE_URL is the app DSN that runs
      # under the NOSUPERUSER mdi_app role so RLS is exercised end-to-end.
      DATABASE_URL: "postgresql+psycopg://mdi_app:mdi_app@localhost:5432/mdi"
      DATABASE_URL_ADMIN_SYNC: "postgresql://mdi:mdi@localhost:5432/mdi"
      DATABASE_URL_ADMIN: "postgresql+psycopg://mdi:mdi@localhost:5432/mdi"
      GOOGLE_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MDI_USE_REAL_EMBEDDINGS: "false"
      DAILY_SPEND_CAP_USD: "100"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap Postgres (extensions + mdi_app role)
        env:
          PGPASSWORD: mdi
        run: |
          for i in {1..30}; do
            if psql -h localhost -U mdi -d mdi -c "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done

          psql -h localhost -U mdi -d mdi <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS pg_trgm;

          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mdi_app') THEN
              CREATE ROLE mdi_app LOGIN PASSWORD 'mdi_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END$$;

          GRANT CONNECT ON DATABASE mdi TO mdi_app;
          GRANT USAGE ON SCHEMA public TO mdi_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mdi_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO mdi_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mdi_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO mdi_app;
          SQL

      - name: Run alembic migrations
        run: |
          alembic upgrade head

      - name: Re-grant mdi_app on tables created by alembic
        env:
          PGPASSWORD: mdi
        run: |
          psql -h localhost -U mdi -d mdi <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO mdi_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO mdi_app;
          SQL

      - name: Ruff
        run: ruff check src/mdi tests

      - name: Pytest (offline only)
        run: pytest -q
